name: Keep Supabase Active

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 */1 * *'
  workflow_dispatch: # Keeps the manual "Run workflow" button available

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TABLE_NAME: "events" # Make sure your real table name is here!
        run: |
          node -e '
            const url = process.env.SUPABASE_URL;
            const key = process.env.SUPABASE_ANON_KEY;
            const table = process.env.TABLE_NAME;
            
            if (!url || !key) {
              console.error("Error: Secrets are missing.");
              process.exit(1);
            }

            const cleanUrl = `${url.replace(/\/+$/, "")}/rest/v1/${table}?select=*&limit=1`;
            console.log("Pinging URL:", cleanUrl);

            fetch(cleanUrl, {
              headers: { 
                "apikey": key,
                "Authorization": `Bearer ${key}`
              }
            })
            .then(res => {
              console.log("HTTP Response Status:", res.status, res.statusText);
              if (res.status >= 200 && res.status < 400) {
                console.log("Success! Active connection registered with Supabase.");
              } else {
                console.error(`Received HTTP status ${res.status}. Check if table name or API key is correct.`);
                process.exit(1);
              }
            })
            .catch(err => {
              console.error("Fetch error:", err);
              process.exit(1);
            });
          '
